version: "3"

services:
  feishu-webhook:
    container_name: promalert-feishu-webhook
    image: promalert-feishu-webhook:20230327-v1679885508
    restart: always
    ports:
      - "3880:8080"
    environment:
      APP_ENV: "prod"
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"

      # ===== 机器人配置(三种方式, 按优先级选择其一) =====
      # 方式一(推荐, 多机器人): 挂载 JSON 配置文件, 结构见 bots.json.example
      APP_FS_BOTS_FILE: "/data/feishu-webhook/bots.json"
      # 方式二(少量机器人): 直接把 JSON 写在环境变量里
      # APP_FS_BOTS: '[{"name":"ops","webhook":"https://open.feishu.cn/open-apis/bot/v2/hook/xxx","secret":"签名密钥","alert_type":"interactive","default":true}]'
      # 方式三(兼容旧版单机器人):
      # APP_FS_WEBHOOK: "https://open.feishu.cn/open-apis/bot/v2/hook/50xxx-xxxxxxxx"
      # APP_FS_SECRET: "飞书自定义机器人安全设置中的签名校验秘钥"
      # APP_FS_ALERT_TYPE: "post"

      # true = 每条告警广播给所有机器人; false(默认) = 按告警标签 feishu_bot 路由, 无标签走 default 机器人
      APP_FS_ROUTE_ALL: "false"
    volumes:
      - ./bots.json:/data/feishu-webhook/bots.json:ro
    networks:
      - feishu-webhook

networks:
  feishu-webhook:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.24.0.0/24
